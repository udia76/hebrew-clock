services:
  - type: web
    name: hebrew-clock
    runtime: docker          # Docker build gives Pillow + libraqm (correct Hebrew shaping)
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT            # the Dockerfile listens on 8765
        value: 8765
      - key: DISPLAY_LAG
        value: 8
      - key: LOG_LEVEL
        value: info
